<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improvizovaný úkryt – konvenční zbraně – 3D model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Rozvržení: pracovní plocha s 3D scénou vlevo, panel legendy vpravo (na telefonu pod scénou).
   Barvy podle mezinárodního znaku civilní ochrany: modrý trojúhelník na oranžovém poli. */
:root {
  --bg: #eef0ee;          /* papírová šedá s nádechem zelené */
  --panel: #f8f9f7;
  --ink: #1c2124;
  --muted: #5d666b;
  --line: #d3d8d6;
  --accent: #e8771d;      /* oranž CO */
  --accent-ink: #9a4600;
  --blue: #1f4e9c;        /* modř CO */
  --scene: #dfe3e1;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191c; --panel: #1b2226; --ink: #e6ebec; --muted: #9aa6ab; --line: #2c363b;
    --accent: #f08a33; --accent-ink: #ffb67a; --blue: #7aa5ec; --scene: #20282c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14191c; --panel: #1b2226; --ink: #e6ebec; --muted: #9aa6ab; --line: #2c363b;
  --accent: #f08a33; --accent-ink: #ffb67a; --blue: #7aa5ec; --scene: #20282c; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; box-sizing: border-box; }
header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 34px; height: 34px; flex: none; background: var(--accent); display: grid; place-items: center; border-radius: 3px; }
.mark svg { width: 24px; height: 24px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; padding: 7px 12px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.seg button:focus-visible, .chip:focus-visible, .views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; min-height: 0; }
.stage { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--scene); }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 11.5px; font-weight: 600;
  padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,.92); color: #1c2124; border: 1px solid rgba(0,0,0,.18); }
.lbl::after { content: ""; position: absolute; left: var(--sx, 50%); bottom: calc(-5px - var(--ex, 0px)); width: 1px; height: calc(5px + var(--ex, 0px)); background: rgba(0,0,0,.45); }
.lbl.k { border-color: #e8771d; } .lbl.c { border-color: #1f4e9c; }
.views { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.views button, .chip { font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; }
.views button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); }
.toggles { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.hint { position: absolute; left: 12px; top: 14px; font-size: 11.5px; color: var(--muted); }
aside.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; overflow: auto; min-width: 0; }
aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); margin: 0 0 6px; }
aside .lead { margin: 0 0 12px; color: var(--muted); line-height: 1.45; }
.legend { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 7px; }
.legend li { display: grid; grid-template-columns: 14px 1fr; gap: 9px; align-items: start; line-height: 1.35; }
.sw { width: 14px; height: 14px; border-radius: 2px; margin-top: 2px; border: 1px solid rgba(0,0,0,.2); }
dl.nums { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; padding-top: 12px; border-top: 1px solid var(--line); }
dl.nums dt { color: var(--muted); } dl.nums dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.note { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.capture header.bar, .capture aside.panel, .capture .views, .capture .toggles, .capture .hint { display: none !important; }
.capture .lbl { font-size: 17px; padding: 3px 8px; }
.capture .app { padding: 0; grid-template-rows: 1fr; } .capture .work { grid-template-columns: 1fr; } .capture .stage { border: 0; border-radius: 0; }
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: auto auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 340px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 22 20H2Z" fill="#1f4e9c"/></svg></div>
      <div>
        <h1>Improvizovaný úkryt proti konvenčním zbraním</h1>
        <p>RD Soběslav III · 3D model domu a úkrytu · Bc. Karel Bezpalec</p>
      </div>
    </div>
    <div class="seg" role="group" aria-label="Varianta">
      <button id="v-stav" data-v="stav" aria-pressed="false">Stávající stav</button>
      <button id="v-konv" data-v="konv" aria-pressed="true">Konvenční zbraně</button>
      <button id="v-nh3" data-v="nh3" aria-pressed="false">Únik amoniaku</button>
    </div>
  </header>
  <div class="work">
    <div class="stage">
      <canvas id="c" aria-label="3D model domu a kotelny – tažením otáčet, kolečkem nebo sevřením přibližovat"></canvas>
      <div id="labels"></div>
      <div class="toggles">
        <button class="chip" id="t-lbl" aria-pressed="true">Popisky</button>
        <button class="chip" id="t-cut" aria-pressed="true">Řez stěnami</button>
      </div>
      <div class="views" role="group" aria-label="Pohled">
        <button id="p-dum" data-p="dum" aria-pressed="true">Dům</button>
        <button id="p-rez" data-p="rez" aria-pressed="false">Řez</button>
        <button id="p-suteren" data-p="suteren" aria-pressed="false">Suterén</button>
        <button id="p-celek" data-p="celek" aria-pressed="false">Kotelna</button>
        <button id="p-zvenku" data-p="zvenku" aria-pressed="false">Zvenku</button>
        <button id="p-interier" data-p="interier" aria-pressed="false">Interiér</button>
        <button id="p-vstup" data-p="vstup" aria-pressed="false">Vstup z dílny</button>
      </div>
      <div class="hint">tažení = otáčení · kolečko = přiblížení · pravé tlačítko = posun</div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* ------------------------------------------------------------------ rozměry z výkresové dokumentace (mm)
   výkres: x = sever → jih (od vnitřního líce severní stěny), y = západ → východ, z = výška (±0,000 = podlaha 1.NP)
   3D:     X = y/1000 (východ), Y = (z − ZF)/1000 (nahoru od podlahy kotelny), Z = x/1000 (jih) */
const KX = 4230, KY = 4080, WN = 520, WE = 520, WS = 370, WW = 500;
const O2 = [1370, 2170], O1 = [2710, 3510], O3 = [2790, 3490];
const DOOR = [1250, 2050], DOOR_H = 1700;
const VYK = [3330, 4230], VYK_D = 375, PR = [3480, 4080];
const N1Y = 1095, N2Y = 2590, SX = 2115;
const ZF = -2160, ZC = -220, ZT = -980, ZP = -900, ZW = -450, ZTOP = 0;
const BAR = 600;
const M = v => v / 1000;
const X = y => M(y), Y = z => M(z - ZF), Z = x => M(x);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);

/* ------------------------------------------------------------------ procedurální textury */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function canvasTex(w, h, draw, rep = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4; t.userData = { size: rep }; return t;
}
function noise(g, w, h, a, r, n = 6000) { for (let i = 0; i < n; i++) { const v = (r() - .5) * a; g.fillStyle = v > 0 ? `rgba(255,255,255,${v})` : `rgba(0,0,0,${-v})`; g.fillRect(r() * w, r() * h, 2, 2); } }
const TEX = {
  stone: canvasTex(512, 512, (g, w, h) => {
    const r = rng(7); g.fillStyle = '#8c8475'; g.fillRect(0, 0, w, h);
    for (let row = 0, y = 0; y < h; row++) { const rh = 40 + r() * 40; let x = -r() * 60;
      while (x < w) { const sw = 60 + r() * 110; const c = 150 + r() * 55; const t = r() * 12;
        g.fillStyle = `rgb(${c},${c - 6 - t},${c - 20 - t})`;
        g.beginPath(); g.moveTo(x + 5 + r() * 6, y + 4 + r() * 5); g.lineTo(x + sw - 4 - r() * 8, y + 3 + r() * 6);
        g.lineTo(x + sw - 3 - r() * 6, y + rh - 4 - r() * 6); g.lineTo(x + 4 + r() * 8, y + rh - 3 - r() * 5); g.closePath(); g.fill();
        x += sw; }
      y += rh; }
    noise(g, w, h, .18, r, 9000);
  }, 1.2),
  brick: canvasTex(512, 256, (g, w, h) => {
    const r = rng(3); g.fillStyle = '#c9b8a3'; g.fillRect(0, 0, w, h);
    const bw = 128, bh = 32;
    for (let j = 0; j < h / bh; j++) for (let i = -1; i < w / bw + 1; i++) {
      const x = i * bw + (j % 2 ? bw / 2 : 0); const c = r();
      g.fillStyle = `rgb(${175 + c * 50},${95 + c * 40},${70 + c * 30})`; g.fillRect(x + 3, j * bh + 3, bw - 6, bh - 6); }
    noise(g, w, h, .2, r, 7000);
  }, 1.0),
  plaster: canvasTex(256, 256, (g, w, h) => { const r = rng(11); g.fillStyle = '#e7e3da'; g.fillRect(0, 0, w, h); noise(g, w, h, .07, r, 5000); }, 1.5),
  concrete: canvasTex(256, 256, (g, w, h) => { const r = rng(5); g.fillStyle = '#b8b9b4'; g.fillRect(0, 0, w, h); noise(g, w, h, .12, r, 8000); }, 1.5),
  ceiling: canvasTex(256, 256, (g, w, h) => { const r = rng(9); g.fillStyle = '#8d8f8c'; g.fillRect(0, 0, w, h); noise(g, w, h, .16, r, 7000); }, 1.5),
  osb: canvasTex(256, 256, (g, w, h) => { const r = rng(13); g.fillStyle = '#c99e5f'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) { const c = r(); g.fillStyle = `rgba(${120 + c * 90},${80 + c * 60},${30 + c * 30},.55)`;
      g.save(); g.translate(r() * w, r() * h); g.rotate(r() * 3.14); g.fillRect(-14, -4, 28 + r() * 16, 7 + r() * 5); g.restore(); } }, 0.8),
  bag: canvasTex(128, 128, (g, w, h) => { const r = rng(17); g.fillStyle = '#cbb894'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(90,70,40,.18)'; for (let i = 0; i < w; i += 4) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
    noise(g, w, h, .1, r, 1500); }, 0.4),
  soil: canvasTex(256, 256, (g, w, h) => { const r = rng(21); g.fillStyle = '#7b5d3f'; g.fillRect(0, 0, w, h); noise(g, w, h, .25, r, 9000); }, 1.5),
  plank: canvasTex(256, 256, (g, w, h) => { const r = rng(23); for (let i = 0; i < 6; i++) { const c = r() * 20;
      g.fillStyle = `rgb(${52 + c},${46 + c},${40 + c})`; g.fillRect(i * w / 6, 0, w / 6 - 3, h); } noise(g, w, h, .15, r, 3000); }, 1.0),
  geo: canvasTex(128, 128, (g, w, h) => { const r = rng(29); g.fillStyle = '#eceae4'; g.fillRect(0, 0, w, h); noise(g, w, h, .08, r, 1500); }, 1.0),
  render: canvasTex(256, 256, (g, w, h) => { const r = rng(31); g.fillStyle = '#d6c4a0'; g.fillRect(0, 0, w, h); noise(g, w, h, .08, r, 7000); }, 1.2),
  plinth: canvasTex(256, 256, (g, w, h) => { const r = rng(33); g.fillStyle = '#6d6c68'; g.fillRect(0, 0, w, h); noise(g, w, h, .4, r, 16000); }, 0.8),
  tiles: canvasTex(256, 256, (g, w, h) => { const r = rng(35); g.fillStyle = '#4a2c22'; g.fillRect(0, 0, w, h);
    const R = 4, Cc = 8; for (let j = 0; j < R; j++) for (let i = 0; i <= Cc; i++) { const x = i * w / Cc - (j % 2 ? w / Cc / 2 : 0), y = j * h / R, c = r() * 22;
      g.fillStyle = `rgb(${118 + c},${66 + c * .6},${50 + c * .4})`; g.beginPath(); g.moveTo(x + 2, y + 2); g.lineTo(x + w / Cc - 2, y + 2);
      g.lineTo(x + w / Cc - 3, y + h / R - 6); g.quadraticCurveTo(x + w / Cc / 2, y + h / R + 2, x + 3, y + h / R - 6); g.closePath(); g.fill(); }
    noise(g, w, h, .12, r, 4000); }, 1.3),
  grass: canvasTex(256, 256, (g, w, h) => { const r = rng(37); g.fillStyle = '#7f9a5c'; g.fillRect(0, 0, w, h); noise(g, w, h, .25, r, 14000); }, 2.0),
};
const mat = (opt) => new THREE.MeshStandardMaterial(Object.assign({ roughness: .92, metalness: 0 }, opt));
const MAT = {
  stone: mat({ map: TEX.stone }), brick: mat({ map: TEX.brick }), plaster: mat({ map: TEX.plaster }),
  floor: mat({ map: TEX.concrete }), ceiling: mat({ map: TEX.ceiling, side: THREE.DoubleSide }), osb: mat({ map: TEX.osb }),
  bag: mat({ map: TEX.bag, roughness: 1 }), soil: mat({ map: TEX.soil, roughness: 1 }), geo: mat({ map: TEX.geo }),
  steel: mat({ color: 0x3d4247, metalness: .55, roughness: .45 }), steelNew: mat({ color: 0xc62d1f, metalness: .4, roughness: .5 }),
  timber: mat({ color: 0xd4a464, roughness: .8 }), glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd6dc, transparent: true, opacity: .32, roughness: .1, metalness: 0 }),
  frame: mat({ color: 0x5b6a5b, metalness: .4, roughness: .6 }), oldDoor: mat({ map: TEX.plank }),
  newDoor: mat({ color: 0x6e7c6f, metalness: .3, roughness: .6 }), mattress: mat({ color: 0x3f6aa8 }), blanket: mat({ color: 0x8a9a7b }),
  shelf: mat({ color: 0x7c868c, metalness: .35, roughness: .55 }), box: mat({ color: 0xb58b52 }), canister: mat({ color: 0x2f62c4, roughness: .5 }),
  wc: mat({ color: 0xe6e6e0, roughness: .4 }), curtain: mat({ color: 0x9fb7c4, transparent: true, opacity: .3, side: THREE.DoubleSide }),
  foil: new THREE.MeshPhysicalMaterial({ color: 0xcfe9ff, transparent: true, opacity: .42, roughness: .15, side: THREE.DoubleSide }),
  tape: mat({ color: 0x9a9da0, roughness: .6 }), towel: mat({ color: 0x5a8fb8 }), led: mat({ color: 0xffffff, emissive: 0xfff3d6, emissiveIntensity: .9 }),
  emerg: mat({ color: 0x1e9f5a, emissive: 0x0e6a3a, emissiveIntensity: .6 }), red: mat({ color: 0xc8261d, roughness: .5 }),
  pipe: mat({ color: 0x9aa4a8, metalness: .5, roughness: .4 }), vzt: mat({ color: 0x14a3b4, metalness: .2, roughness: .5 }),
  dark: mat({ color: 0x2b2f33 }), mask: mat({ color: 0x323a2e }), chair: mat({ color: 0x5b4632 }), table: mat({ color: 0x9b7a55 }),
  infill: mat({ color: 0xc94f3a, map: TEX.brick }), cloud: new THREE.MeshStandardMaterial({ color: 0xdff2c8, transparent: true, opacity: .22, depthWrite: false, roughness: 1 }),
  tub: mat({ color: 0x3b7bd1, roughness: .5 }), white: mat({ color: 0xf2f2ee }), yellow: mat({ color: 0xf2c200 }),
  render: mat({ map: TEX.render }), plinth: mat({ map: TEX.plinth, roughness: 1 }), roof: mat({ map: TEX.tiles, roughness: .85 }),
  ridge: mat({ color: 0x5a3328, roughness: .85 }), grass: mat({ map: TEX.grass, roughness: 1 }), gutter: mat({ color: 0x7f898b, metalness: .4, roughness: .5 }),
  frameW: mat({ color: 0xeeede8, roughness: .5 }), doorW: mat({ color: 0x5b3a26, roughness: .7 }), concreteL: mat({ color: 0xbbb8b0 }),
  glassBlock: new THREE.MeshPhysicalMaterial({ color: 0xdfeef2, transparent: true, opacity: .6, roughness: .4 }),
};
// materiály stěn bližších ke kameře (jižní a západní) se při pohledu „Celek“ seříznou
const CUT = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1.05);
const CUTMAT = {};
['stone', 'brick', 'plaster', 'oldDoor', 'newDoor', 'infill', 'foil', 'tape', 'frame', 'glass', 'red', 'plinth'].forEach(k => { CUTMAT[k] = MAT[k].clone(); CUTMAT[k].clipShadows = true; });

/* ------------------------------------------------------------------ pomocné funkce geometrie */
function boxUV(geo, w, h, d, s) {         // UV v měřítku světa, aby textura nebyla roztažená
  const uv = geo.attributes.uv; const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dims[f][0] / s, uv.getY(k) * dims[f][1] / s); }
  uv.needsUpdate = true; return geo;
}
function box(parent, x0, x1, y0, y1, z0, z1, material, opts = {}) {   // souřadnice výkresu v mm
  const w = Math.abs(M(y1 - y0)), h = Math.abs(M(z1 - z0)), d = Math.abs(M(x1 - x0));
  if (w < 1e-4 || h < 1e-4 || d < 1e-4) return null;
  const g = new THREE.BoxGeometry(w, h, d);
  if (material.map) boxUV(g, w, h, d, material.map.userData.size || 1);
  const m = new THREE.Mesh(g, material);
  m.position.set(X((y0 + y1) / 2), Y((z0 + z1) / 2), Z((x0 + x1) / 2));
  m.castShadow = opts.cast !== false; m.receiveShadow = true; if (opts.name) m.name = opts.name;
  parent.add(m); return m;
}
// stěna s otvory: osa 'x' = stěna probíhá podél x (západní/východní), 'y' = podél y (severní/jižní)
function wall(parent, along, a0, a1, t0, t1, z0, z1, holes, material) {
  const cuts = [a0, a1]; holes.forEach(o => cuts.push(o[0], o[1])); const s = [...new Set(cuts)].sort((p, q) => p - q);
  for (let i = 0; i < s.length - 1; i++) {
    const p = s[i], q = s[i + 1]; if (q - p < 1) continue;
    const hs = holes.filter(o => o[0] <= p && o[1] >= q);
    let zz = [z0]; hs.forEach(o => zz.push(o[2], o[3])); zz.push(z1); zz.sort((u, v) => u - v);
    for (let k = 0; k < zz.length - 1; k += 2) {
      if (zz[k + 1] - zz[k] < 1) continue;
      if (along === 'x') box(parent, p, q, t0, t1, zz[k], zz[k + 1], material); else box(parent, t0, t1, p, q, zz[k], zz[k + 1], material);
    }
  }

const VIEWS = {

let secOn = false, view = 'dum';

function setView(name) { const v = VIEWS[name]; view = name; target.set(...v.t); Object.assign(sph, { r: v.r, th: v.th, ph: v.ph }); camera.fov = v.fov; camera.updateProjectionMatrix();
  ceilingSlab.visible = name === 'interier' || name === 'vstup' || !!v.ceil; cloud.visible = v.cloud !== false; setCut(v.cut);
  G.upper.visible = v.upper !== false; secOn = !!v.sec; renderer.clippingPlanes = secOn ? [SEC] : []; sun.castShadow = !secOn;
  buildLabels(); applyCam();
  document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === name))); }
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, b: e.button, pan: e.button === 2 || e.shiftKey }; canvas.setPointerCapture(e.pointerId); });

/* ------------------------------------------------------------------ varianty, panel a popisky */
const PANEL = {

    nums: [['Bez větrání, 4 osoby', '8,4 h'], ['Bez větrání, 3 osoby', '11,1 h'], ['Výměna vzduchu', '1,5 → 0,3 h⁻¹'], ['Vrchol uvnitř (500 ppm, 1 h)', '388 → 130 ppm']],
    note: 'Únik kapalné fáze vytváří u zdroje studenou mlhu těžší než vzduch – pak a při pokynu k ukrytí ve vyšších patrech se kotelna nepoužívá a platí pokyn HZS. Pohledy Dům, Řez a Suterén ukazují úkryt v celém domě.' },
};
let variant = 'konv';
const ONLY = ['stav', 'konv'], DEF = 'konv';   // varianty zobrazené na této stránce
document.querySelectorAll('.seg button').forEach(b => { if (!ONLY.includes(b.dataset.v)) b.remove(); });
function setVariant(v) { variant = v; G.stav.visible = v === 'stav'; G.konv.visible = v === 'konv'; G.nh3.visible = v === 'nh3';
  G.raw.visible = v === 'stav'; G.plaster.visible = v !== 'stav';

  const p = PANEL[v]; const el = document.getElementById('panel');

    <dl class="nums">${p.nums.map(([a, b]) => `<dt>${a}</dt><dd>${b.replace('S_C', 'S<sub>C</sub>')}</dd>`).join('')}</dl><p class="note">${p.note}</p>`;
  buildLabels(); dirty = true; }
const labelsEl = document.getElementById('labels'); let lblOn = true; let lblNodes = [];
function buildLabels() { labelsEl.innerHTML = ''; lblNodes = labels.filter(l => l.vars.includes(variant) && l.views.includes(view)).map(l => { const d = document.createElement('div'); d.className = 'lbl ' + l.cls; d.textContent = l.text; labelsEl.appendChild(d); return [l, d]; }); }
const ray = new THREE.Raycaster(); const CUTSET = new Set(Object.values(CUTMAT));
function shown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function occlusion() { const occ = []; scene.traverse(o => { if (o.isMesh && !o.material.transparent && shown(o)) occ.push(o); });
  const cp = camera.position; const dir = new THREE.Vector3();
  lblNodes.forEach(([l, d]) => { dir.copy(l.p).sub(cp); const dist = dir.length(); dir.normalize(); ray.set(cp, dir); ray.far = Math.max(0, dist - .15);
    const hits = ray.intersectObjects(occ, false).filter(hh => !(cutOn && CUTSET.has(hh.object.material) && hh.point.y > CUT.constant)
      && !(secOn && hh.point.x > SEC.constant));
    l.hidden = hits.length > 0; }); dirty = false; }
function placeLabels() { if (!lblOn) { labelsEl.hidden = true; return; } labelsEl.hidden = false; if (dirty) occlusion();
  const w = canvas.clientWidth, h = canvas.clientHeight; const v = new THREE.Vector3();
  const placed = [];

    if (!vis) { d.style.display = 'none'; return; }

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0 = performance.now();
function frame(now) { resize(); if (!reduce && G.nh3.visible) { const t = (now - t0) / 1000; cloud.children.forEach((m, i) => { m.position.y = m.userData.base + .25 * Math.sin(t * .4 + i); }); }
  renderer.render(scene, camera); placeLabels(); requestAnimationFrame(frame); }
themeBg(); window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeBg);
new MutationObserver(themeBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
let start = 'dum'; try { const h = (location.hash || '').slice(1); if (VIEWS[h]) start = h; } catch (e) { /* bez hash */ }
